services:
  mission-control:
    build:
      context: ./apps/mission-control
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL não configurada}
      REDIS_URL: ${REDIS_URL:?REDIS_URL não configurada}
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL não configurada}
      MINIO_BASE_URL: ${MINIO_BASE_URL:-http://minio:9000}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:3b}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-120}
      OLLAMA_VERIFY_MODEL: ${OLLAMA_VERIFY_MODEL:-true}
      SSC_ADMIN_USERNAME: ${SSC_ADMIN_USERNAME:?SSC_ADMIN_USERNAME não configurado}
      SSC_ADMIN_PASSWORD_HASH: ${SSC_ADMIN_PASSWORD_HASH:?SSC_ADMIN_PASSWORD_HASH não configurado}
      SSC_SESSION_SECRET: ${SSC_SESSION_SECRET:?SSC_SESSION_SECRET não configurado}
      SSC_SESSION_MAX_AGE_SECONDS: ${SSC_SESSION_MAX_AGE_SECONDS:-28800}
      SSC_COOKIE_SECURE: ${SSC_COOKIE_SECURE:-false}
      SSC_ENVIRONMENT: ${SSC_ENVIRONMENT:-development}
      MC_STATUS_COLLECT_INTERVAL_SECONDS: ${MC_STATUS_COLLECT_INTERVAL_SECONDS:-10}
      MC_STATUS_CACHE_TTL_SECONDS: ${MC_STATUS_CACHE_TTL_SECONDS:-30}
      MC_STATUS_SSE_INTERVAL_SECONDS: ${MC_STATUS_SSE_INTERVAL_SECONDS:-3}
    ports:
      - "${SSC_ACCESS_BIND_ADDRESS:-0.0.0.0}:${SSC_ACCESS_HOST_PORT:-8080}:8080"
    networks:
      - public
      - application
      - data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8080/health',
          timeout=3
          )
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      com.stieve-software-company.platform: "companyos"
      com.stieve-software-company.service: "mission-control"
