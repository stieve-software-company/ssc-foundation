<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Acesso | SSC Mission Control</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  <link rel="stylesheet" href="/branding/theme.css">
  <link rel="stylesheet" href="{{ url_for('static', path='/branding-global.css') }}">
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="brand-panel">
      <div class="brand-mark large branding-logo-frame">
        <img src="/branding/logo" alt="Logo do Mission Control">
      </div>

      <div class="brand-copy">
        <p class="eyebrow">Stieve Software Company</p>
        <h1>Mission<br>Control</h1>
        <p>
          Usuários, permissões, auditoria e infraestrutura em um único
          centro de comando.
        </p>
      </div>

      <div class="system-status">
        <span class="status-dot"></span>
        <span>CompanyOS v0.2.1</span>
      </div>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <header>
          <p class="eyebrow">Acesso seguro</p>
          <h2>Bem-vindo de volta</h2>
          <p>Entre com suas credenciais para acessar o painel.</p>
        </header>

        {% if error %}
        <div class="alert danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login" class="stack-form">
          <label for="username">Usuário</label>
          <input
            id="username"
            name="username"
            type="text"
            value="{{ username or '' }}"
            autocomplete="username"
            required
            autofocus
          >

          <label for="password">Senha</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >

          <button class="primary-button" type="submit">
            Acessar Mission Control
          </button>
        </form>

        <footer class="login-footer">
          <span>Ambiente protegido</span>
          <span>SSC v0.2.1</span>
        </footer>
      </div>
    </section>
  </main>
</body>
</html>
