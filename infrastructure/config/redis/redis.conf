# ============================================================
# Stieve Software Company — CompanyOS
# Redis 8 — configuração operacional
# ============================================================

# ------------------------------------------------------------
# Rede
# ------------------------------------------------------------

bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ------------------------------------------------------------
# Processo e clientes
# ------------------------------------------------------------

daemonize no
supervised no
databases 16
maxclients 200

# ------------------------------------------------------------
# Logs
# ------------------------------------------------------------

loglevel notice
logfile ""

# ------------------------------------------------------------
# Persistência RDB
# ------------------------------------------------------------

dir /data
dbfilename dump.rdb

save 3600 1
save 300 100
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# ------------------------------------------------------------
# Persistência AOF
# ------------------------------------------------------------

appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec

no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

aof-load-truncated yes
aof-use-rdb-preamble yes

# ------------------------------------------------------------
# Memória
# ------------------------------------------------------------

# maxmemory e maxmemory-policy são recebidos pelo Compose para
# permitir ajustes por ambiente sem duplicar este arquivo.

maxmemory-samples 5

# ------------------------------------------------------------
# Expiração e liberação assíncrona
# ------------------------------------------------------------

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ------------------------------------------------------------
# Ciclo interno
# ------------------------------------------------------------

hz 10
dynamic-hz yes
